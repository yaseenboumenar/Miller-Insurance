version: "3.9"

x-airflow-common: &airflow-common
  build: .    # <-- build image from Dockerfile in this folder
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor              # Use LocalExecutor so tasks run in parallel using local processes
    AIRFLOW__CORE__FERNET_KEY: "8aygt8xzoUkhbluvdmZ5YsZCM-PIJzkJqCLl5mGAWcQ="    # Key used to encrypt data in the metadata DB
                                                        # Generated by >> python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"               # Don't load example DAGs that come with it
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"           # Lets you use the config from web UI
    AIRFLOW_HOME: /opt/airflow

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  
  volumes:
    # Airflow base dirs
    - ./dags:/opt/airflow/dags                        # ./dags file location = file location
    - ./logs:/opt/airflow/logs                        # Writes logs into /opt/airflow/logs, otherwise they vanish when the container is destroyed
    - ./plugins:/opt/airflow/plugins                  # If we want to add custom operators later
    - ..:/opt/airflow/miller-insurance-data-platform   # .. = the project root (one level above airflow)
                                                            # Now mounts the whole container into /opt/airflow/dags/miller-insurance-data-platform

  # Run as non-root user so file permissions stay sensible on host
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate"
    environment:
      <<: *airflow-common-env

  webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    environment:
      <<: *airflow-common-env

  scheduler:
    <<: *airflow-common
    command: scheduler
    environment:
      <<: *airflow-common-env

volumes:
  postgres-db-volume:

  # Docker’s way of saying “create a persistent volume for Postgres data”, so the metadata DB survives container restarts

  # For setting up admin user on Airflow:
  # docker compose run --rm webserver airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com

